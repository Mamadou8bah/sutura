name: Build mobile APKs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-production-apks
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: [sutura-app, sutura-agent, merchant-app]
    defaults:
      run:
        working-directory: ui/${{ matrix.app }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/${{ matrix.app }}/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: expo/expo-github-action@v8
        with:
          eas-version: '27.5.0'
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Build signed installable APK on the Android runner
        run: eas build --platform android --profile production-apk --non-interactive --local --output "${{ matrix.app }}-latest.apk"
      - name: Upload APK download
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: ui/${{ matrix.app }}/${{ matrix.app }}-latest.apk
          if-no-files-found: error
          retention-days: 14
