name: Build mobile APKs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-production-apks
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: [sutura-app, sutura-agent, merchant-app]
    defaults:
      run:
        working-directory: ui/${{ matrix.app }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/${{ matrix.app }}/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: expo/expo-github-action@v8
        with:
          eas-version: '27.5.0'
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Check app types and existing tests
        shell: bash
        run: |
          npx tsc --noEmit
          node --test ../shared/mobile-update-config.test.cjs
          if compgen -G 'tests/*.test.cjs' > /dev/null; then
            node --test tests/*.test.cjs
          fi
      - name: Build signed installable APK on the Android runner
        run: eas build --platform android --profile production-apk --non-interactive --local --output "${{ matrix.app }}-latest.apk"
      - name: Verify APK archive and write checksum
        shell: bash
        run: |
          python - "${{ matrix.app }}-latest.apk" <<'PY'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as apk:
              if apk.testzip() is not None or not {"AndroidManifest.xml", "classes.dex"}.issubset(apk.namelist()):
                  raise SystemExit("APK is incomplete or corrupt")
          PY
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$signer" verify --verbose --print-certs "${{ matrix.app }}-latest.apk"
          "$signer" verify --print-certs "${{ matrix.app }}-latest.apk" > apk-certificate.txt
          "$(dirname "$signer")/aapt" dump badging "${{ matrix.app }}-latest.apk" > apk-metadata.txt
          grep -E '^(package:|sdkVersion:|targetSdkVersion:|native-code:)' apk-metadata.txt
          python - "${{ matrix.app }}" <<'PY'
          import json, pathlib, re, sys
          app = sys.argv[1]
          expected = json.loads(pathlib.Path('../../.github/mobile-signing-certificates.json').read_text())[app]
          actual = re.findall(r'certificate SHA-256 digest: ([a-fA-F0-9]+)', pathlib.Path('apk-certificate.txt').read_text())
          if not actual or {value.lower() for value in actual} != {expected}:
              raise SystemExit('Signing certificate changed; refusing an incompatible app update')
          metadata = pathlib.Path('apk-metadata.txt').read_text()
          if not re.search(r"native-code:.*'arm64-v8a'", metadata):
              raise SystemExit('APK does not support ARM64 phones')
          version = re.search(r"versionCode='(\d+)'", metadata).group(1)
          pathlib.Path(f'{app}.version').write_text(version)
          PY
          sha256sum "${{ matrix.app }}-latest.apk" > "${{ matrix.app }}-latest.apk.sha256"
      - name: Upload APK download
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: |
            ui/${{ matrix.app }}/${{ matrix.app }}-latest.apk
            ui/${{ matrix.app }}/${{ matrix.app }}-latest.apk.sha256
            ui/${{ matrix.app }}/${{ matrix.app }}.version
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  install:
    name: Test Android installation (${{ matrix.app }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: sutura-app
            package: gm.sutura.customer
          - app: sutura-agent
            package: gm.sutura.agent
          - app: merchant-app
            package: gm.sutura.merchant
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.app }}-apk
          path: current
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download the previous published APK for upgrade testing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo "$GITHUB_REPOSITORY" \
            --pattern '${{ matrix.app }}-latest.apk' --pattern '${{ matrix.app }}-latest.apk.sha256' --dir previous
          (cd current && sha256sum --check '${{ matrix.app }}-latest.apk.sha256')
          (cd previous && sha256sum --check '${{ matrix.app }}-latest.apk.sha256')
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify fresh install, upgrade and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install --no-streaming current/${{ matrix.app }}-latest.apk
            adb shell pm path ${{ matrix.package }}
            adb uninstall ${{ matrix.package }}
            adb install --no-streaming previous/${{ matrix.app }}-latest.apk
            adb install -r --no-streaming current/${{ matrix.app }}-latest.apk
            adb shell am start -W -n ${{ matrix.package }}/.MainActivity
            sleep 5
            adb shell pidof ${{ matrix.package }}

  publish:
    name: Publish direct APK downloads
    needs: [build, install]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-apk'
          merge-multiple: true
          path: apks
      - name: Publish installable APKs on GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: mobile-apks-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          for app in sutura-app sutura-agent merchant-app; do
            (cd apks && sha256sum --check "$app-latest.apk.sha256")
            version="$(cat "apks/$app.version")"
            cp "apks/$app-latest.apk" "apks/$app-v$version.apk"
            (cd apks && sha256sum "$app-v$version.apk" > "$app-v$version.apk.sha256")
          done
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Sutura Android apps (${GITHUB_SHA:0:7})" --draft \
            --notes 'Download the .apk file for your app directly. No ZIP extraction is needed. SHA-256 checksum files are included.'
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" apks/*.apk apks/*.sha256
      - name: Verify the GitHub downloads before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: mobile-apks-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          mkdir verified-downloads
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern '*.apk' --pattern '*.sha256' --dir verified-downloads
          signer="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$signer"
          for app in sutura-app sutura-agent merchant-app; do
            (cd verified-downloads && sha256sum --check "$app-latest.apk.sha256")
            "$signer" verify --verbose "verified-downloads/$app-latest.apk"
            version="$(cat "apks/$app.version")"
            (cd verified-downloads && sha256sum --check "$app-v$version.apk.sha256")
            cmp "verified-downloads/$app-latest.apk" "verified-downloads/$app-v$version.apk"
          done
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
