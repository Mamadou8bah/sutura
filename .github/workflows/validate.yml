name: Validate Sutura
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: server/sutura
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: .\mvnw.cmd -B test
  backend-deployment:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sutura_deployment_test
          POSTGRES_USER: validation
          POSTGRES_PASSWORD: ci-disposable-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U validation -d sutura_deployment_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DEPLOYMENT_TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/sutura_deployment_test
      DEPLOYMENT_TEST_DATABASE_USER: validation
      DEPLOYMENT_TEST_DATABASE_PASSWORD: ci-disposable-password
      TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/sutura_deployment_test
      TEST_DATABASE_USER: validation
      TEST_DATABASE_PASSWORD: ci-disposable-password
      TEST_DATABASE_DRIVER: org.postgresql.Driver
      REDIS_TEST_PORT: "6379"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: bash mvnw -B -Dspring.flyway.enabled=true -Dspring.jpa.hibernate.ddl-auto=validate test
        working-directory: server/sutura
  backend-image:
    runs-on: ubuntu-latest
    needs: [backend, backend-deployment]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: server/sutura
          push: false
          tags: sutura-api:validation
          cache-from: type=gha
          cache-to: type=gha,mode=max
  mobile:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [sutura-app, sutura-agent, merchant-app]
    defaults:
      run:
        working-directory: ui/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npx --no-install tsc --noEmit
      - if: matrix.app == 'sutura-app' || matrix.app == 'merchant-app'
        run: node --test tests/*.test.cjs
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/web
    env:
      NEXT_PUBLIC_API_BASE_URL: https://api.sutura.example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/web/package-lock.json
      - run: npm ci
      - run: npm run build
