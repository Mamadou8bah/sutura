name: Keep Sutura awake

on:
  schedule:
    # Every twenty minutes, away from the busiest minute at the top of the hour.
    - cron: '3,23,43 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: sutura-backend-keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Ping Sutura liveness
        shell: bash
        run: |
          curl --fail --silent --show-error \
            --connect-timeout 15 --max-time 60 \
            --retry 2 --retry-delay 5 --retry-max-time 200 \
            --output "$RUNNER_TEMP/sutura-health.json" \
            --write-out 'Sutura health: HTTP %{http_code} in %{time_total}s\n' \
            https://suturagambia.onrender.com/actuator/health/liveness
          python - "$RUNNER_TEMP/sutura-health.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as response:
              health = json.load(response)
          if health.get("status") != "UP":
              raise SystemExit("Sutura did not report UP")
          print("Sutura is responding")
          PY
