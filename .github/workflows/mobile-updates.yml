name: Publish mobile updates

on:
  push:
    branches: [main]
    paths:
      - 'ui/sutura-app/**'
      - 'ui/sutura-agent/**'
      - 'ui/merchant-app/**'
      - 'ui/shared/**'
      - '.github/workflows/mobile-updates.yml'
      - '.gitattributes'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-production-updates
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [sutura-app, sutura-agent, merchant-app]
    defaults:
      run:
        working-directory: ui/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: node --test ../shared/mobile-update-config.test.cjs
      - run: npx tsc --noEmit
      - name: Run app tests when present
        run: |
          if compgen -G 'tests/*.test.cjs' > /dev/null; then
            node --test tests/*.test.cjs
          fi

  publish:
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: sutura-app
            projectVariable: SUTURA_CUSTOMER_EAS_PROJECT_ID
          - app: sutura-agent
            projectVariable: SUTURA_AGENT_EAS_PROJECT_ID
          - app: merchant-app
            projectVariable: SUTURA_MERCHANT_EAS_PROJECT_ID
    defaults:
      run:
        working-directory: ui/${{ matrix.app }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      SUTURA_EAS_PROJECT_ID: ${{ vars[matrix.projectVariable] }}
      SUTURA_REQUIRE_OTA: '1'
      SUTURA_UPDATE_CHANNEL: production
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.SUTURA_API_BASE_URL || 'https://suturagambia.onrender.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/${{ matrix.app }}/package-lock.json
      - name: Check publishing configuration
        run: |
          node <<'NODE'
          if (!process.env.EXPO_TOKEN) throw new Error('Add EXPO_TOKEN to GitHub Actions repository secrets.');
          require('../shared/mobile-update-config.cjs')({}, process.env);
          if (new URL(process.env.EXPO_PUBLIC_API_BASE_URL).protocol !== 'https:') {
            throw new Error('SUTURA_API_BASE_URL must use HTTPS.');
          }
          NODE
      - uses: expo/expo-github-action@v8
        with:
          eas-version: '20.5.1'
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Publish compatible Android update
        run: eas update --channel production --platform android --message "GitHub $GITHUB_SHA" --non-interactive
