# Backend-only free Render deployment. See docs/deploy-backends.md.
services:
- type: web
  name: suturagambia
  runtime: docker
  plan: free
  region: frankfurt
  dockerfilePath: ./server/sutura/Dockerfile
  dockerContext: ./server/sutura
  maxShutdownDelaySeconds: 60
  healthCheckPath: /actuator/health/readiness
  numInstances: 1
  envVars:
  - key: SPRING_PROFILES_ACTIVE
    value: prod,render,render-free
  - key: RENDER_DB_HOST
    fromDatabase:
      name: sutura-db
      property: host
  - key: RENDER_DB_PORT
    fromDatabase:
      name: sutura-db
      property: port
  - key: RENDER_DB_NAME
    fromDatabase:
      name: sutura-db
      property: database
  - key: SPRING_DATASOURCE_USERNAME
    fromDatabase:
      name: sutura-db
      property: user
  - key: SPRING_DATASOURCE_PASSWORD
    fromDatabase:
      name: sutura-db
      property: password
  - key: REDIS_URL
    fromService:
      name: sutura-cache
      type: keyvalue
      property: connectionString
  - key: JWT_SECRET
    generateValue: true
  - key: SUTURA_CORS_ALLOWED_ORIGINS
    sync: false
  - key: SUTURA_SENTINEL_BASE_URL
    sync: false
  - key: SUTURA_SENTINEL_API_KEY
    sync: false
  - key: SUTURA_SENTINEL_TENANT_CODE
    sync: false
  - key: SUTURA_SENTINEL_WEBHOOK_SECRET
    sync: false
  - key: MODEMPAY_API_KEY
    sync: false
  - key: MODEMPAY_PUBLIC_KEY
    sync: false
  - key: MODEMPAY_WEBHOOK_SIGNING_SECRET
    sync: false
  - key: MODEMPAY_API_URL
    value: https://api.modempay.com
  - key: JOKOOR_API_KEY
    sync: false
  - key: SUTURA_ALERT_EMAIL
    sync: false
  - key: SUTURA_EMAIL_FROM
    sync: false
  - key: SUTURA_EMAIL_API_KEY
    sync: false
  - key: JAVA_OPTS
    value: -XX:+UseContainerSupport -XX:MaxRAMPercentage=45 -XX:MaxMetaspaceSize=160m
      -XX:ReservedCodeCacheSize=32m -Xss512k
  - key: SUTURA_BOOTSTRAP_ENABLED
    value: 'true'
  - key: SUTURA_BOOTSTRAP_FIRST_NAME
    sync: false
  - key: SUTURA_BOOTSTRAP_LAST_NAME
    sync: false
  - key: SUTURA_BOOTSTRAP_EMAIL
    sync: false
  - key: SUTURA_BOOTSTRAP_PHONE
    sync: false
  - key: SUTURA_BOOTSTRAP_PASSWORD
    sync: false
  - key: SUTURA_EMAIL_PROVIDER
    value: resend
- type: keyvalue
  name: sutura-cache
  plan: free
  region: frankfurt
  maxmemoryPolicy: noeviction
  ipAllowList: []
databases:
- name: sutura-db
  plan: free
  region: frankfurt
  postgresMajorVersion: '17'
  databaseName: sutura
  user: sutura
  ipAllowList: []
