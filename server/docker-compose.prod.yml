services:
  gateway:
    image: caddy:2-alpine
    environment:
      SUTURA_API_DOMAIN: ${SUTURA_API_DOMAIN:?Set the public API hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      sutura-app:
        condition: service_healthy
    networks: [sutura-network]
    restart: unless-stopped

  sutura-web:
    profiles: ["web"]
    build:
      context: ../ui/web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      sutura-app:
        condition: service_healthy
    networks:
      - sutura-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: sutura-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sutura}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sutura}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sutura-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sutura-redis
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sutura-network
    restart: unless-stopped

  sutura-app:
    build:
      context: ./sutura
      dockerfile: Dockerfile
    container_name: sutura-app
    init: true
    read_only: true
    tmpfs: ["/tmp", "/app/logs"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 40s
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sutura}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      SUTURA_SMS_PROVIDER: jokoor
      JOKOOR_API_KEY: ${JOKOOR_API_KEY:?JOKOOR_API_KEY is required}
      SUTURA_ALERT_EMAIL: ${SUTURA_ALERT_EMAIL:?SUTURA_ALERT_EMAIL is required}
      SUTURA_EMAIL_FROM: ${SUTURA_EMAIL_FROM:?SUTURA_EMAIL_FROM is required}
      SUTURA_EMAIL_PROVIDER: ${SUTURA_EMAIL_PROVIDER:-resend}
      SUTURA_EMAIL_API_KEY: ${SUTURA_EMAIL_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SUTURA_CORS_ALLOWED_ORIGINS: ${SUTURA_CORS_ALLOWED_ORIGINS:?Set the exact HTTPS web origins}
      MODEMPAY_WEBHOOK_SIGNING_SECRET: ${MODEMPAY_WEBHOOK_SIGNING_SECRET:?MODEMPAY_WEBHOOK_SIGNING_SECRET is required}
      MODEMPAY_API_KEY: ${MODEMPAY_API_KEY:?MODEMPAY_API_KEY is required}
      MODEMPAY_PUBLIC_KEY: ${MODEMPAY_PUBLIC_KEY:-}
      MODEMPAY_API_URL: ${MODEMPAY_API_URL:-https://api.modempay.com}
      SUTURA_SENTINEL_WEBHOOK_SECRET: ${SUTURA_SENTINEL_WEBHOOK_SECRET:?SUTURA_SENTINEL_WEBHOOK_SECRET is required}
      SUTURA_SENTINEL_TENANT_CODE: ${SUTURA_SENTINEL_TENANT_CODE:?SUTURA_SENTINEL_TENANT_CODE is required}
      SUTURA_SENTINEL_BASE_URL: ${SUTURA_SENTINEL_BASE_URL:?SUTURA_SENTINEL_BASE_URL is required}
      SUTURA_SENTINEL_API_KEY: ${SUTURA_SENTINEL_API_KEY:?SUTURA_SENTINEL_API_KEY is required}
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/actuator/health/readiness"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - sutura-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


volumes:
  caddy_data:
  caddy_config:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  sutura-network:
    driver: bridge
