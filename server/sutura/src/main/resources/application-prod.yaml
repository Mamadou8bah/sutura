spring:
  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
    clean-disabled: true
  task:
    scheduling:
      pool:
        size: 4
  lifecycle:
    timeout-per-shutdown-phase: 30s
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  application:
    name: sutura

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        format_sql: false
        use_sql_comments: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD}
      timeout: 2000
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

  cache:
    # Avoid stale risk/audit decisions and Java entity serialization in money paths.
    # Redis remains required for distributed authentication rate limits.
    type: none
    redis:
      time-to-live: 600000

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  port: ${SERVER_PORT:5000}
  shutdown: graceful
  forward-headers-strategy: native
  max-http-request-header-size: 16KB
  tomcat:
    threads:
      max: 200
      min-spare: 10
    accept-count: 100
    max-connections: 10000
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-minutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:15}
  refresh-token-expiration-days: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:7}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db,redis
    metrics:
      enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  metrics:
    enable:
      jvm: true
      process: true
      system: true
      tomcat: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
        auth.login.duration: true
        transfer.execution.duration: true
        risk.evaluation.duration: true
        ledger.posting.duration: true
        webhook.processing.duration: true

logging:
  level:
    root: WARN
    com.mamadou.sutura: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{correlationId}] %-5level %logger{36} - %msg%n"
  file:
    name: "" # Container logs go to stdout; retention is managed by the runtime.
    max-size: 100MB
    max-history: 30
    total-size-cap: 10GB
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30
      total-size-cap: 10GB

sutura:
  auth:
    require-second-factor: true
  cors:
    allowed-origins: ${SUTURA_CORS_ALLOWED_ORIGINS:}
  notifications:
    alert-email: ${SUTURA_ALERT_EMAIL}
    sms:
      provider: jokoor
      jokoor:
        api-key: ${JOKOOR_API_KEY:}
    email:
      provider: ${SUTURA_EMAIL_PROVIDER:resend}
      api-key: ${SUTURA_EMAIL_API_KEY:}
      from: ${SUTURA_EMAIL_FROM:no-reply@sutura.local}

  webhooks:
    modempay:
      enabled: ${MODEMPAY_ENABLED:true}
      signing-secret: ${MODEMPAY_WEBHOOK_SIGNING_SECRET:}
      signature-header: ${MODEMPAY_WEBHOOK_SIGNATURE_HEADER:x-modem-signature}
      api-key: ${MODEMPAY_API_KEY:}
      public-key: ${MODEMPAY_PUBLIC_KEY:}
      api-url: ${MODEMPAY_API_URL:https://api.modempay.com}

  ratelimit:
    fail-open: false
    login:
      requests: 5
      window-seconds: 60
    refresh:
      requests: 10
      window-seconds: 60
    api-key:
      requests: 1000
      window-seconds: 3600
    default:
      requests: 100
      window-seconds: 60

  risk:
    critical-threshold: ${SUTURA_RISK_CRITICAL_THRESHOLD:9.0}
    high-threshold: ${SUTURA_RISK_HIGH_THRESHOLD:7.0}
    medium-threshold: ${SUTURA_RISK_MEDIUM_THRESHOLD:5.0}
    block-critical: ${SUTURA_RISK_BLOCK_CRITICAL:true}
    block-high: ${SUTURA_RISK_BLOCK_HIGH:false}
    daily-threshold: ${SUTURA_RISK_DAILY_THRESHOLD:50000}
    daily-transaction-count: ${SUTURA_RISK_DAILY_TRANSACTION_COUNT:20}
    rapid-transfer-window-seconds: ${SUTURA_RISK_RAPID_TRANSFER_WINDOW_SECONDS:300}
    rapid-transfer-count: ${SUTURA_RISK_RAPID_TRANSFER_COUNT:5}
    new-wallet-age-days: ${SUTURA_RISK_NEW_WALLET_AGE_DAYS:7}
    new-wallet-high-value-threshold: ${SUTURA_RISK_NEW_WALLET_HIGH_VALUE_THRESHOLD:10000}

  fraud-detection:
    connected: ${SUTURA_SENTINEL_CONNECTED:true}
    enabled: ${SUTURA_FRAUD_ENABLED:true}
    base-url: ${SUTURA_SENTINEL_BASE_URL:}
    timeout-ms: ${SUTURA_FRAUD_TIMEOUT_MS:2000}
    default-country: ${SUTURA_FRAUD_DEFAULT_COUNTRY:GM}
    default-channel: ${SUTURA_FRAUD_DEFAULT_CHANNEL:api}
    api-key: ${SUTURA_SENTINEL_API_KEY}

  sentinel-webhook:
    signing-secret: ${SUTURA_SENTINEL_WEBHOOK_SECRET:}
    tenant-code: ${SUTURA_SENTINEL_TENANT_CODE:}
