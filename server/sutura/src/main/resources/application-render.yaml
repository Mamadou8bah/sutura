# Activate together with prod: SPRING_PROFILES_ACTIVE=prod,render
server:
  port: ${PORT:10000}
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      schema: public
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: 2
  data:
    redis:
      url: ${REDIS_URL}
      host: localhost # URL takes precedence; avoids unresolved generic-host placeholders.
      password: ${REDIS_PASSWORD:}
