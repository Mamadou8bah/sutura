# Isolated test databases only; set TEST_DATABASE_* for a disposable PostgreSQL run.
spring.datasource.url=${TEST_DATABASE_URL:jdbc:h2:mem:sutura_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${TEST_DATABASE_USER:sa}
spring.datasource.password=${TEST_DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${TEST_DATABASE_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=update
spring.cache.type=none
spring.task.scheduling.enabled=false
sutura.scheduling.enabled=false
logging.file.name=target/test-application.log
